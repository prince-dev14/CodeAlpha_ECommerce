{% extends 'shop/base.html' %}
{% block title %}Checkout{% endblock %}
{% block content %}
<h2>Checkout</h2>
<p>{{ items|length }} item(s) · Total: <strong>₹{{ total }}</strong></p>
<form method="post" class="box">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn" type="submit">Place Order</button>
</form>
{% endblock %}
