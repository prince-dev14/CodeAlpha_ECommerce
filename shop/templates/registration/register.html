{% extends 'shop/base.html' %}
{% block title %}Register{% endblock %}
{% block content %}
<h2>Create an account</h2>
<form method="post" class="box">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn" type="submit">Register</button>
  <p>Already registered? <a href="{% url 'login' %}">Login</a></p>
</form>
{% endblock %}
