{% extends 'shop/base.html' %}
{% block title %}Login{% endblock %}
{% block content %}
<h2>Login</h2>
<form method="post" class="box">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn" type="submit">Login</button>
  <p>New here? <a href="{% url 'register' %}">Create an account</a></p>
</form>
{% endblock %}
